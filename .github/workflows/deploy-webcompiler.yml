name: Deploy Webcompiler

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-webcompiler
  cancel-in-progress: false

jobs:
  deploy:
    # Gate before checkout: workflow_run is privileged. A fork PR whose branch
    # happens to be named main must never supply the verifier/SSH script.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify Exact Revision Passed CI
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_deploy_ci.py

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WEBCOMPILER_DEPLOY_SSH_KEY }}

      - name: Setup Node for Verified Frontend
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Exact Revision Frontend
        working-directory: frontend
        env:
          VITE_APP_BASE_PATH: /webcompiler/
          VITE_API_URL: /webcompiler
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          npm ci
          npm run build

      - name: Package Verified Frontend
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 scripts/package_deploy_frontend.py frontend/dist "$RUNNER_TEMP/frontend-deploy.tar.gz" "$DEPLOY_SHA"

      - name: Deploy Verified Revision Under One Remote Lock
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_HOST: ${{ secrets.WEBCOMPILER_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.WEBCOMPILER_DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.WEBCOMPILER_DEPLOY_PORT }}
          DEPLOY_REPO: ${{ github.server_url }}/${{ github.repository }}.git
          DEPLOY_USER: ${{ secrets.WEBCOMPILER_DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.WEBCOMPILER_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_FRONTEND_ARCHIVE: ${{ runner.temp }}/frontend-deploy.tar.gz
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/dispatch_deploy.py
