name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Config validation only; startup scripts resolve actual host ownership/GID.
env:
  WEBCOMPILER_WORKER_UID: "10001"
  WEBCOMPILER_WORKER_GID: "10001"
  WEBCOMPILER_DOCKER_GID: "999"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r backend/requirements.lock
          python -m pip check

      - name: Audit Backend Dependencies and Generate Lockfile SBOM
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/backend-sbom.cdx.json" "$RUNNER_TEMP/backend-sbom.manifest.json"
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" \
            --requirement backend/requirements.lock \
            --disable-pip \
            --strict \
            --format cyclonedx-json \
            --output "$RUNNER_TEMP/backend-sbom.cdx.json"

      - name: Validate Backend SBOM Against Locked Source
        id: backend-sbom-validation
        # pip-audit remains a blocking vulnerability gate.  Run this after a
        # scanner failure too, so a generated SBOM is independently checked.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          sbom="$RUNNER_TEMP/backend-sbom.cdx.json"
          manifest="$RUNNER_TEMP/backend-sbom.manifest.json"
          test -s "$sbom"
          python3 scripts/verify_sbom.py \
            --ecosystem pypi \
            --lockfile backend/requirements.lock \
            --sbom "$sbom" \
            --commit "$GITHUB_SHA" \
            --manifest "$manifest"
          test -s "$manifest"

      - name: Upload Backend Dependency SBOM
        if: ${{ always() && steps.backend-sbom-validation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-cyclonedx-sbom-${{ github.sha }}
          path: |
            ${{ runner.temp }}/backend-sbom.cdx.json
            ${{ runner.temp }}/backend-sbom.manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Run Backend Tests
        # Kernel identity tests need a procfs mounted for their PID namespace.
        # Hosted runner users cannot inspect root-owned host PID1 namespaces.
        # Create a private namespace, then drop back to the original UID/GID:
        # do not weaken production identity checks or skip the real Linux tests.
        run: |
          sudo unshare --mount --pid --fork --mount-proc --propagation private --kill-child=SIGKILL \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            "$(command -v python)" -m pytest -q backend/tests

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Frontend Lockfile SBOM
        working-directory: frontend
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/frontend-sbom.cdx.json" "$RUNNER_TEMP/frontend-sbom.manifest.json"
          # This is the complete locked application graph, including dev
          # dependencies; it is not an assertion about installed inventory.
          # npm 10 emits duplicate CycloneDX references for repeated installs.
          # Pin only this generator; do not replace the application's npm/lock.
          npx --yes --package npm@11.19.1 -- npm sbom --package-lock-only --sbom-format cyclonedx --sbom-type application \
            > "$RUNNER_TEMP/frontend-sbom.cdx.json"
          test -s "$RUNNER_TEMP/frontend-sbom.cdx.json"

      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: npm audit --audit-level=low

      - name: Validate Frontend SBOM Against Locked Source
        id: frontend-sbom-validation
        # Keep validation reachable when npm audit reports vulnerabilities.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          sbom="$RUNNER_TEMP/frontend-sbom.cdx.json"
          manifest="$RUNNER_TEMP/frontend-sbom.manifest.json"
          test -s "$sbom"
          python3 scripts/verify_sbom.py \
            --ecosystem npm \
            --lockfile frontend/package-lock.json \
            --sbom "$sbom" \
            --commit "$GITHUB_SHA" \
            --manifest "$manifest"
          test -s "$manifest"

      - name: Upload Frontend Dependency SBOM
        if: ${{ always() && steps.frontend-sbom-validation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-cyclonedx-sbom-${{ github.sha }}
          path: |
            ${{ runner.temp }}/frontend-sbom.cdx.json
            ${{ runner.temp }}/frontend-sbom.manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm run test:run

      - name: Typecheck Frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Default Compose
        run: PROJECT_ROOT="$GITHUB_WORKSPACE" docker compose -f docker-compose.yml config >/dev/null

      - name: Validate Deploy Compose Overlay
        run: |
          PROJECT_ROOT="$GITHUB_WORKSPACE" \
          WEBCOMPILER_BACKEND_PORT_MAPPING="127.0.0.1:18000:8000" \
          WEBCOMPILER_FRONTEND_PORT_MAPPING="127.0.0.1:15173:80" \
          WEBCOMPILER_API_BASE="/webcompiler" \
          WEBCOMPILER_BASE_PATH="/webcompiler/" \
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml config >/dev/null

      - name: Validate Shared Runtime Compose Overlay For Both Colors
        run: |
          validate_shared_runtime_color() {
          local color="$1"
          local backend_port="$2"
          local frontend_port="$3"
          local config="$RUNNER_TEMP/shared-runtime-$color.json"

          COMPOSE_PROFILES="" \
          COMPOSE_PROJECT_NAME="webcompiler-$color" \
          PROJECT_ROOT="$GITHUB_WORKSPACE" \
          WEBCOMPILER_BACKEND_PORT_MAPPING="127.0.0.1:$backend_port:8000" \
          WEBCOMPILER_FRONTEND_PORT_MAPPING="127.0.0.1:$frontend_port:80" \
          WEBCOMPILER_API_BASE="/webcompiler" \
          WEBCOMPILER_BASE_PATH="/webcompiler/" \
          WEBCOMPILER_POSTGRES_HOST="webcompiler-postgres" \
          WEBCOMPILER_POSTGRES_PORT="5432" \
          WEBCOMPILER_POSTGRES_PASSWORD="webcompiler-ci-shared-postgres-password-12345" \
          WEBCOMPILER_DATABASE_URL="postgresql+psycopg2://caller:caller@external.invalid:5432/caller" \
          WEBCOMPILER_MIGRATION_DATABASE_URL="postgresql+psycopg2://caller:caller@external.invalid:5432/caller" \
          WEBCOMPILER_REDIS_URL="redis://webcompiler-redis:6379/0" \
          WEBCOMPILER_REDIS_KEY_PREFIX="webcompiler-ci-shared" \
          RUNTIME_POOL_ID="caller-pool-must-not-win" \
          WEBCOMPILER_RUNTIME_INSTANCE_ID="11111111111111111111111111111111" \
          RUNTIME_INSTANCE_ID="ffffffffffffffffffffffffffffffff" \
          SANDBOX_POOL_ID="webcompiler-ci-shared-sandbox" \
          docker compose \
            -p "webcompiler-$color" \
            --env-file /dev/null \
            -f docker-compose.yml \
            -f docker-compose.deploy.yml \
            -f docker-compose.shared-runtime.yml \
            config --format json > "$config"

          python3 - "$config" "$color" <<'PY'
          import json
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit


          def require(condition, message):
              if not condition:
                  raise SystemExit(message)


          config = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          color = sys.argv[2]
          services = config.get("services")
          require(isinstance(services, dict) and services, f"{color}: no default services rendered")

          for service in ("postgres", "redis"):
              require(service not in services, f"{color}: color-local {service} is enabled")

          expected_url = "redis://webcompiler-redis:6379/0"
          expected_prefix = "webcompiler-ci-shared"
          expected_pool = f"webcompiler-{color}"
          expected_instance = "11111111111111111111111111111111"
          caller_instance = "ffffffffffffffffffffffffffffffff"
          expected_sandbox_pool = "webcompiler-ci-shared-sandbox"
          expected_password = "webcompiler-ci-shared-postgres-password-12345"

          def require_database_url(url, host, role):
              parsed = urlsplit(url)
              require(parsed.scheme == "postgresql+psycopg2",
                      f"{color}: {role} does not use the managed PostgreSQL scheme")
              require(parsed.username == "compiler" and parsed.password == expected_password,
                      f"{color}: {role} does not use the explicit shared PostgreSQL credential")
              require(parsed.hostname == host and parsed.port == 5432 and parsed.path == "/compiler",
                      f"{color}: {role} does not target the managed PostgreSQL endpoint")

          for service in ("initialize", "backend", "worker"):
              runtime = services.get(service)
              require(isinstance(runtime, dict), f"{color}: {service} is missing")
              environment = runtime.get("environment")
              require(isinstance(environment, dict), f"{color}: {service} has no resolved environment")
              require(environment.get("REDIS_URL") == expected_url,
                      f"{color}: {service} does not use the shared Redis URL")
              require(environment.get("REDIS_KEY_PREFIX") == expected_prefix,
                      f"{color}: {service} does not use the shared Redis namespace")
              if service in ("initialize", "backend", "worker"):
                  require(environment.get("RUNTIME_INSTANCE_ID") == expected_instance,
                          f"{color}: {service} does not use the reserved runtime instance")
                  require(environment.get("RUNTIME_INSTANCE_ID") != caller_instance,
                          f"{color}: {service} accepted the caller runtime instance override")
              if service in ("backend", "worker"):
                  require(environment.get("RUNTIME_POOL_ID") == expected_pool,
                          f"{color}: {service} does not derive its readiness pool from the Compose project")
                  require(environment.get("SANDBOX_POOL_ID") == expected_sandbox_pool,
                          f"{color}: {service} does not retain the shared sandbox pool")
              dependencies = runtime.get("depends_on", {})
              require("postgres" not in dependencies and "redis" not in dependencies,
                      f"{color}: {service} retains a color-local stateful dependency")
              require_database_url(environment.get("DATABASE_URL", ""),
                                   "webcompiler-postgres" if service == "initialize" else "pgbouncer",
                                   service)

          pooler = services.get("pgbouncer")
          require(isinstance(pooler, dict), f"{color}: pgbouncer is missing")
          require(pooler.get("environment", {}).get("DB_HOST") == "webcompiler-postgres",
                  f"{color}: pgbouncer does not target the shared PostgreSQL host")
          require(pooler.get("environment", {}).get("DB_PASSWORD") == expected_password,
                  f"{color}: pgbouncer does not use the explicit shared PostgreSQL credential")
          require("postgres" not in pooler.get("depends_on", {}),
                  f"{color}: pgbouncer retains a color-local PostgreSQL dependency")
          require("@webcompiler-postgres:5432/" in services["initialize"]["environment"]["DATABASE_URL"],
                  f"{color}: initializer does not target the shared PostgreSQL host")
          PY
          }

          validate_shared_runtime_color blue 18101 15174
          validate_shared_runtime_color green 18102 15175

      - name: Validate Multi-API Compose Overlay
        run: |
          python3 scripts/render_api_proxy.py --upstream backend:8000 --docker-dns > "$RUNNER_TEMP/api-proxy.conf"
          PROJECT_ROOT="$GITHUB_WORKSPACE" \
          WEBCOMPILER_API_PROXY_CONFIG="$RUNNER_TEMP/api-proxy.conf" \
          docker compose -f docker-compose.yml -f docker-compose.lb.yml config >/dev/null

      - name: Validate Managed Ready Pools For Both Colors
        # Read-only config resolution, not service creation or rollout proof.
        run: RUN_SHARED_REDIS_INTEGRATION=1 python3 backend/tests/test_shared_runtime_live.py -v

  image-security:
    # Required even when RUN_LONG_E2E is disabled. Never continue-on-error:
    # source-lock scans do not cover OS/installed packages in built images.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [backend-tests, frontend-checks, compose-config]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download hash-pinned Trivy
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/trivy-0.74.0"
          mkdir -m 700 "$scanner"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 180 \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output "$scanner/release.tar.gz"
          printf '%s  %s\n' 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a "$scanner/release.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner/release.tar.gz" -C "$scanner" trivy

      - name: Setup bounded BuildKit builder
        uses: ./.github/actions/setup-bounded-builder

      - name: Build and scan immutable application images
        run: |
          python3 scripts/ci_image_security.py \
            --commit "$GITHUB_SHA" \
            --trivy "$RUNNER_TEMP/trivy-0.74.0/trivy" \
            --output-dir "$RUNNER_TEMP/application-image-security" \
            --cache-dir "$RUNNER_TEMP/trivy-cache"

      - name: Upload installed-image security evidence
        # A failed policy may still produce useful sanitized reports. The job
        # remains failed; missing reports are not interpreted as a clean scan.
        if: ${{ always() && hashFiles('scripts/ci_image_security.py') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: application-image-security-${{ github.sha }}
          path: ${{ runner.temp }}/application-image-security/**/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove bounded CI BuildKit builder
        if: always()
        run: bash scripts/cleanup_ci_builder.sh

  e2e-stack:
    if: ${{ vars.RUN_LONG_E2E == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
      - compose-config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker version

      - name: Setup bounded BuildKit builder
        uses: ./.github/actions/setup-bounded-builder

      - name: Run Docker E2E
        run: python3 scripts/e2e_stack_test.py

      - name: Clean Up Docker Stack
        id: e2e-stack-cleanup
        if: always()
        # Recover the recorded nonce after interruption, never the checkout's
        # default Compose project. Failure must remain a failed job.
        run: python3 scripts/e2e_stack_test.py --cleanup

      - name: Remove bounded CI BuildKit builder
        if: ${{ always() && steps.e2e-stack-cleanup.outcome == 'success' }}
        run: bash scripts/cleanup_ci_builder.sh

  browser-e2e:
    if: ${{ vars.RUN_LONG_E2E == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks
      - compose-config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Setup bounded BuildKit builder
        uses: ./.github/actions/setup-bounded-builder

      - name: Start Webcompiler Deploy-Like Stack
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BPP_USE_RELEASE_BINARY: "1"
        run: bash scripts/docker_up_webcompiler.sh

      - name: Run Playwright Browser E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:15173
        run: npm run e2e:playwright

      - name: Dump Deploy-Like Stack Logs On Failure
        if: failure()
        run: |
          PROJECT_ROOT="$GITHUB_WORKSPACE" \
          COMPOSE_PROJECT_NAME="webcompiler-local" \
          WEBCOMPILER_BACKEND_PORT_MAPPING="127.0.0.1:18000:8000" \
          WEBCOMPILER_FRONTEND_PORT_MAPPING="127.0.0.1:15173:8080" \
          docker compose -f docker-compose.yml -f docker-compose.deploy.yml logs --no-color || true

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Clean Up Deploy-Like Stack
        if: always()
        run: bash scripts/docker_down_webcompiler.sh || true

      - name: Remove bounded CI BuildKit builder
        if: always()
        run: bash scripts/cleanup_ci_builder.sh
