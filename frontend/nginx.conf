access_log /dev/stdout;
client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

upstream backend_upstream {
    zone frontend_api 64k;
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 1s;
    least_conn;
    server backend:8000 resolve;
    keepalive 32;
}

limit_conn_zone $binary_remote_addr zone=judge_upload_ip:64k;
limit_conn_zone $server_name zone=judge_upload_total:32k;

server {
    listen 8080;
    server_name _;
    # Covers the 200 KiB code and 64 KiB stdin limits plus JSON escaping overhead.
    client_max_body_size 512k;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain;

    # Monaco is self-hosted; only avatar SVGs are fetched from the named image host.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.dicebear.com; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    # The public host redirects every HTTP path to HTTPS. Do not include
    # subdomains: their transport policy is outside this service's scope.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /api/v1/admin/judge-test-data/ {
        client_max_body_size 16m;
        limit_conn judge_upload_ip 2;
        limit_conn judge_upload_total 8;
        limit_conn_status 429;
        client_body_timeout 10s;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /webcompiler/api/v1/admin/judge-test-data/ {
        client_max_body_size 16m;
        limit_conn judge_upload_ip 2;
        limit_conn judge_upload_total 8;
        limit_conn_status 429;
        client_body_timeout 10s;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_pass http://backend_upstream/api/v1/admin/judge-test-data/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webcompiler/api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/terminal {
        proxy_pass http://backend_upstream/ws/terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webcompiler/ws/terminal {
        proxy_pass http://backend_upstream/ws/terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /webcompiler/health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Readiness is distinct from liveness: only advertise this instance while
    # its schema, queue and worker dependencies are ready to accept traffic.
    location = /ready {
        proxy_pass http://backend_upstream/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /webcompiler/ready {
        proxy_pass http://backend_upstream/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Baked at image build time for deploy postflight. Exact locations keep it
    # out of the SPA fallback for both root and /webcompiler deployments.
    # Location-level add_header directives do not inherit server-level headers,
    # so retain the applicable non-document protections beside no-store.
    location = /.well-known/webcompiler-release.json {
        alias /usr/share/nginx/html/.well-known/webcompiler-release.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    }

    location = /webcompiler/.well-known/webcompiler-release.json {
        alias /usr/share/nginx/html/.well-known/webcompiler-release.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    }

    location ~* ^/webcompiler/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|svg|png|webp)$ {
        rewrite ^/webcompiler/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
    }

    location ~* ^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|svg|png|webp)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
    }

    # Requests that look like files must never fall through to index.html.
    location ~* ^/webcompiler/.+\.[A-Za-z0-9]{1,12}$ {
        rewrite ^/webcompiler/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location ~* ^/.+\.[A-Za-z0-9]{1,12}$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location /webcompiler/ {
        rewrite ^/webcompiler/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
