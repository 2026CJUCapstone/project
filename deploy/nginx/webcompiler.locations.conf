location = /webcompiler {
    return 302 /webcompiler/;
}

location = /webcompiler/health {
    proxy_pass http://127.0.0.1:18000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /webcompiler/ready {
    proxy_pass http://127.0.0.1:18000/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /webcompiler/api/v1/admin/judge-test-data/ {
    # Server-side admin authentication runs before body consumption. Stream to
    # the bounded application receiver; do not spool 16 MiB before auth.
    client_max_body_size 16m;
    client_body_timeout 10s;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_pass http://127.0.0.1:18000/api/v1/admin/judge-test-data/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}

location /webcompiler/api/ {
    client_max_body_size 512k;
    proxy_pass http://127.0.0.1:18000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}

location /webcompiler/ {
    proxy_pass http://127.0.0.1:15173/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
