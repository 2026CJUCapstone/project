# Isolated audit/staging test infrastructure. This is not the production
# architecture. Only the disposable test runner receives Docker socket access
# so integration tests can launch sandbox containers on the same Docker host.
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: "no"
    environment:
      POSTGRES_DB: audit_stage
      POSTGRES_USER: audit_test
      POSTGRES_PASSWORD: audit_test_only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_test -d audit_stage"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: "no"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.125
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  test-runner:
    image: "${AUDIT_TEST_IMAGE:?AUDIT_TEST_IMAGE is required}"
    restart: "no"
    working_dir: /app
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      # Trusted pytest fake CLI executables only; /tmp remains noexec.
      - /test-tmp:size=128m,mode=1777,exec
    volumes:
      - "${AUDIT_ROOT:?AUDIT_ROOT is required}/backend:/app:ro"
      - "${AUDIT_ROOT:?AUDIT_ROOT is required}/frontend:/frontend:ro"
      - "${AUDIT_ROOT:?AUDIT_ROOT is required}/scripts:/scripts:ro"
      - "${AUDIT_ROOT:?AUDIT_ROOT is required}/docker-compose.yml:/docker-compose.yml:ro"
      - "${AUDIT_ROOT:?AUDIT_ROOT is required}/docker-compose.lb.yml:/docker-compose.lb.yml:ro"
      - "${AUDIT_ROOT:?AUDIT_ROOT is required}/docker-compose.deploy.yml:/docker-compose.deploy.yml:ro"
      - "${AUDIT_ROOT:?AUDIT_ROOT is required}/docker-compose.shared-runtime.yml:/docker-compose.shared-runtime.yml:ro"
      - "${AUDIT_ROOT:?AUDIT_ROOT is required}/docker-compose.ready-lb.yml:/docker-compose.ready-lb.yml:ro"
      - "${AUDIT_ROOT:?AUDIT_ROOT is required}/.github:/.github:ro"
      - "${AUDIT_ROOT:?AUDIT_ROOT is required}/runtime:/runtime:ro"
      # The identical host/container path lets sandbox bind mounts resolve on
      # the Docker host. This is writable test data and must not contain source.
      - "${AUDIT_ROOT:?AUDIT_ROOT is required}/staged-sandbox:${AUDIT_ROOT:?AUDIT_ROOT is required}/staged-sandbox"
      # Test runner only; never copy this Docker control plane into production.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://audit_test:audit_test_only@postgres:5432/audit_stage
      TEST_POSTGRES_URL: postgresql://audit_test:audit_test_only@postgres:5432/audit_stage
      AUDIT_ROOT: "${AUDIT_ROOT:?AUDIT_ROOT is required}"
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
      ENVIRONMENT: development
      SECRET_KEY: audit-staging-only-secret-key-never-use-in-production-20260909
      ADMIN_PASSWORD: audit-staging-only-admin-password
      REDIS_URL: ""
      TEST_REDIS_URL: redis://redis:6379/0
      SANDBOX_IMAGE: compiler-sandbox
      SANDBOX_CPU_LIMIT: "0.5"
      SANDBOX_MEMORY_MB: "256"
      EXECUTION_TIMEOUT: "10"
      SANDBOX_WORKDIR_ROOT: "${AUDIT_ROOT:?AUDIT_ROOT is required}/staged-sandbox"
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    command: ["pytest", "-q"]

volumes:
  postgres-data:
  redis-data:
